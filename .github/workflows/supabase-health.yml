name: Supabase Health Check

on:
  schedule:
    - cron: "0 0 * * *"  # 毎日午前9時（日本時間）
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Call Supabase Health API
        run: |
          curl -X GET "https://wybedvwlpaherojzuxs.supabase.co/functions/v1/super-responder" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
